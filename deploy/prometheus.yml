global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'yase-crawler'
    static_configs:
      - targets: ['crawler:9090']

  - job_name: 'yase-ingestion'
    static_configs:
      - targets: ['ingestion:9090']

  - job_name: 'yase-indexer'
    static_configs:
      - targets: ['indexer:9090']

  - job_name: 'yase-gateway'
    static_configs:
      - targets: ['gateway:9090']
