replicaCount:
  gateway: 2
  indexer: 1
  ingestion: 1

image:
  repository: ghcr.io/efathom/yase
  tag: latest
  pullPolicy: IfNotPresent

gateway:
  port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70

indexer:
  port: 50052
  healthPort: 8090
  # Upper bound for each vector arena in bytes (arenas grow on demand).
  arenaSize: "68719476736" # 64 GiB
  terminationGracePeriodSeconds: 120 # time for the final checkpoint
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 8Gi

ingestion:
  port: 50051
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

tei:
  enabled: true
  model: "Alibaba-NLP/gte-modernbert-base"
  port: 8888
  resources:
    requests:
      cpu: 2000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 4Gi

teiReranker:
  enabled: false
  model: "Alibaba-NLP/gte-reranker-modernbert-base"
  port: 8081
  resources:
    requests:
      cpu: 2000m
      memory: 2Gi

embedder:
  provider: tei
  dimension: 768

collections:
  basePath: /data/yase/collections
  defaultArena: "68719476736" # bytes, per-collection upper bound
  # Hosts a collection may point its own embedder base_url at (SSRF guard).
  allowedEmbedderHosts: []
  maxCollections: 100

auth:
  enabled: false
  method: jwt # api_key keys must be supplied via a config file
  jwt:
    issuer: ""
    audience: ""
    jwksUrl: "" # e.g. https://idp.example.com/.well-known/jwks.json
    requireTenant: true

rateLimit:
  enabled: false
  backend: redis # shared across gateway replicas
  searchQps: 100

kafka:
  brokers:
    - kafka:9092
  # Use a log-compacted topic keyed by URL so the index can be rebuilt from it.
  topic: crawl-records
  dlqTopic: crawl-records-dlq

redis:
  addr: redis:6379

metrics:
  enabled: true
  port: 9090

serviceAccount:
  create: true
  name: ""

secrets:
  embedderApiKey: ""
  jwtSecret: ""
  # Token the gateway presents to the indexer's gRPC services. The indexer
  # accepts it as an admin service identity (see auth.api_keys).
  internalToken: ""

server:
  # CIDRs of load balancers / ingress whose X-Forwarded-For is trusted.
  trustedProxies: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  # Only gateway pods may reach the indexer's gRPC port.
  enabled: true
