apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-indexer
  labels:
    app: yase
    component: indexer
spec:
  serviceName: {{ .Release.Name }}-indexer
  replicas: {{ .Values.replicaCount.indexer }}
  selector:
    matchLabels:
      app: yase
      component: indexer
  template:
    metadata:
      labels:
        app: yase
        component: indexer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
    spec:
      serviceAccountName: {{ include "yase.serviceAccountName" . }}
      containers:
        - name: indexer
          image: "{{ .Values.image.repository }}/indexer:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.indexer.port }}
              name: grpc
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
          env:
            - name: YASE_KAFKA_BROKERS
              value: "{{ join "," .Values.kafka.brokers }}"
            - name: YASE_KAFKA_TOPIC
              value: "{{ .Values.kafka.topic }}"
            - name: YASE_EMBEDDER_PROVIDER
              value: "{{ .Values.embedder.provider }}"
            - name: YASE_EMBEDDER_DIMENSION
              value: "{{ .Values.embedder.dimension }}"
            - name: YASE_EMBEDDER_BASE_URL
              value: "http://{{ .Release.Name }}-tei:{{ .Values.tei.port }}"
            - name: YASE_INDEX_PATH
              value: "/data/yase/bluge"
            - name: YASE_INDEX_ARENA_SIZE_BYTES
              value: "{{ .Values.indexer.arenaSize }}"
            - name: YASE_INDEX_GRPC_PORT
              value: "{{ .Values.indexer.port }}"
            - name: YASE_COLLECTIONS_BASE_PATH
              value: "{{ .Values.collections.basePath }}"
            - name: YASE_COLLECTIONS_DEFAULT_ARENA
              value: "{{ .Values.collections.defaultArena }}"
            - name: YASE_COLLECTIONS_MAX_COLLECTIONS
              value: "{{ .Values.collections.maxCollections }}"
            - name: YASE_METRICS_ADDR
              value: ":{{ .Values.metrics.port }}"
          volumeMounts:
            - name: data
              mountPath: /data/yase
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
  {{- if .Values.indexer.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.indexer.persistence.storageClass }}
        storageClassName: {{ .Values.indexer.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.indexer.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-indexer
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.indexer.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app: yase
    component: indexer
