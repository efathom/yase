apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app: yase
type: Opaque
stringData:
  # Populate these values (or reference an external secret manager) before
  # enabling auth or using API-key embedders.
  embedder-api-key: {{ .Values.secrets.embedderApiKey | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
