apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app: yase
    component: gateway
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels:
      app: yase
      component: gateway
  template:
    metadata:
      labels:
        app: yase
        component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
    spec:
      serviceAccountName: {{ include "yase.serviceAccountName" . }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}/gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
              name: http
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
          env:
            - name: YASE_SERVER_HTTP_PORT
              value: "{{ .Values.gateway.port }}"
            - name: YASE_EMBEDDER_PROVIDER
              value: "{{ .Values.embedder.provider }}"
            - name: YASE_EMBEDDER_DIMENSION
              value: "{{ .Values.embedder.dimension }}"
            - name: YASE_EMBEDDER_BASE_URL
              value: "http://{{ .Release.Name }}-tei:{{ .Values.tei.port }}"
            - name: YASE_INDEX_GRPC_HOST
              value: "{{ .Release.Name }}-indexer"
            - name: YASE_INDEX_GRPC_PORT
              value: "{{ .Values.indexer.port }}"
            - name: YASE_METRICS_ADDR
              value: ":{{ .Values.metrics.port }}"
            - name: YASE_AUTH_ENABLED
              value: "{{ .Values.auth.enabled }}"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: yase
    component: gateway
