## Multi-node distributed YASE cluster
## Usage: docker compose -f deploy/docker-compose.cluster.yml up -d
##
## Topology:
##   node-0 (bootstrap leader) → Raft:7000, Shard gRPC:50053, HTTP:9100
##   node-1                     → Raft:7001, Shard gRPC:50054, HTTP:9101
##   node-2                     → Raft:7002, Shard gRPC:50055, HTTP:9102
##   dist-gateway               → HTTP:8000 (search API)

services:
  node-0:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cluster-node
    environment:
      YASE_CLUSTER_NODE_ID: node-0
      YASE_CLUSTER_RAFT_ADDR: node-0:7000
      YASE_CLUSTER_RAFT_DIR: /data/raft
      YASE_CLUSTER_SHARD_PORT: 50053
      YASE_INDEX_PATH: /data/index
      YASE_INDEX_ARENA_SIZE_BYTES: 104857600
      YASE_EMBEDDER_PROVIDER: mock
      YASE_EMBEDDER_DIMENSION: 32
      YASE_METRICS_ADDR: ":9090"
    command: ["--bootstrap", "--cluster-http-port", "9100"]
    ports:
      - "7000:7000"
      - "50053:50053"
      - "9100:9100"
    volumes:
      - node0-data:/data

  node-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cluster-node
    environment:
      YASE_CLUSTER_NODE_ID: node-1
      YASE_CLUSTER_RAFT_ADDR: node-1:7001
      YASE_CLUSTER_RAFT_DIR: /data/raft
      YASE_CLUSTER_SHARD_PORT: 50054
      YASE_INDEX_PATH: /data/index
      YASE_INDEX_ARENA_SIZE_BYTES: 104857600
      YASE_EMBEDDER_PROVIDER: mock
      YASE_EMBEDDER_DIMENSION: 32
      YASE_METRICS_ADDR: ":9091"
    command: ["--join", "http://node-0:9100", "--cluster-http-port", "9101"]
    ports:
      - "7001:7001"
      - "50054:50054"
      - "9101:9101"
    depends_on:
      - node-0
    volumes:
      - node1-data:/data

  node-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cluster-node
    environment:
      YASE_CLUSTER_NODE_ID: node-2
      YASE_CLUSTER_RAFT_ADDR: node-2:7002
      YASE_CLUSTER_RAFT_DIR: /data/raft
      YASE_CLUSTER_SHARD_PORT: 50055
      YASE_INDEX_PATH: /data/index
      YASE_INDEX_ARENA_SIZE_BYTES: 104857600
      YASE_EMBEDDER_PROVIDER: mock
      YASE_EMBEDDER_DIMENSION: 32
      YASE_METRICS_ADDR: ":9092"
    command: ["--join", "http://node-0:9100", "--cluster-http-port", "9102"]
    ports:
      - "7002:7002"
      - "50055:50055"
      - "9102:9102"
    depends_on:
      - node-0
    volumes:
      - node2-data:/data

  dist-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dist-gateway
    environment:
      YASE_SERVER_HTTP_PORT: 8000
      YASE_EMBEDDER_PROVIDER: mock
      YASE_EMBEDDER_DIMENSION: 32
      YASE_METRICS_ADDR: ":9093"
    command: ["--cluster-http", "http://node-0:9100", "--http-port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - node-0
      - node-1
      - node-2

volumes:
  node0-data:
  node1-data:
  node2-data:
