name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting
        run: |
          files="$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build-all

      # -race is the project's pre-commit gate and matters here: the code
      # leans on a lock-free arena allocator, atomic entry points, and
      # concurrent HNSW insertion. With -short it costs well under a minute.
      - name: Unit tests (race)
        run: go test -race ./... -short -count=1

  slow-tests:
    name: Full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # The non-short tiers, including the 10K-node HNSW structure test.
      # Kept out of the main job so the fast gate stays fast.
      - name: Unit tests (full)
        env:
          YASE_SLOW_TESTS: "1"
        run: go test ./pkg/... ./internal/... ./client/... -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
